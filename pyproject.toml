[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-info-fetcher"
version = "1.3.0"
license = "MIT"
description = "CrewAI multi-agent employee profile summarizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=1.15.0,<2",
    "python-dotenv>=1.0.0,<2",
    "pydantic-settings>=2.0.0,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "slowapi>=0.1.9,<1",
    "prometheus-fastapi-instrumentator>=7.0.0,<8",
    "pyjwt[crypto]>=2.10.0,<3",
    "httpx>=0.27.0,<1",
]
db = [
    "sqlalchemy>=2.0.0,<3",
    "psycopg[binary]>=3.2.0,<4",
    "alembic>=1.13.0,<2",
]
dev = [
    "pytest>=8.0.0,<9",
    "httpx>=0.27.0,<1",
    "ruff>=0.8.0,<1",
]

[project.scripts]
employee-fetcher = "employee_info_fetcher.app:main"
employee-fetcher-api = "employee_info_fetcher.api.main:serve"
employee-fetcher-db = "employee_info_fetcher.db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
employee_info_fetcher = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
